# Builds the website (https://tegancao.github.io/diary-dialogues/) from the Markdown files in docs/ on every push to
# main. Runs only in the public repository.
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'tegancao/diary-dialogues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      - run: mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
