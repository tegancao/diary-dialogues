<!-- Draw ```mermaid code blocks as diagrams, as GitHub's file view does. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  for (const code of document.querySelectorAll("pre code.language-mermaid, div.language-mermaid code")) {
    const div = document.createElement("div");
    div.className = "mermaid";
    div.textContent = code.textContent;
    (code.closest("div.language-mermaid") || code.closest("pre")).replaceWith(div);
  }
  await document.fonts.load("14px Inter");   // measure labels with the final font, or they get clipped
  await document.fonts.ready;
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run({ querySelector: ".mermaid" });
</script>
