site_name: Diary Dialogues
site_description: How AI chatbots answer simulated people with different ways of seeing themselves and others
site_url: https://tegancao.github.io/diary-dialogues/
repo_url: https://github.com/tegancao/diary-dialogues
repo_name: tegancao/diary-dialogues
edit_uri: ""
docs_dir: docs
exclude_docs: |
  make_*.py
  __pycache__/
  paper-outline.md

plugins:
  - search

theme:
  name: material
  font:
    text: Inter          # the same font as the figures
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
  palette:             # dark by default, with a toggle
    - scheme: slate
      primary: blue grey
      toggle: {icon: material/weather-sunny, name: Light mode}
    - scheme: default
      primary: blue grey
      toggle: {icon: material/weather-night, name: Dark mode}

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Findings: findings.md
  - How we evaluate: evaluation.md
  - Project overview: project-overview.md
  - How steering works: steering-explained.md
  - Self-report vs. text: self-report-vs-text.md

extra_javascript:
  - javascripts/anchor.js
